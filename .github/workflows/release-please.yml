name: Release Please

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Checkout Code
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4

      - name: Package Release Zip
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          mkdir cmyreflection
          cp cmyreflection.h cmy_reflector.py README.md LICENSE cmyreflection/
          cp -r plugins cmyreflection/
          zip -r cmyreflection.zip cmyreflection/

      - name: Upload Core Asset
        if: ${{ steps.release.outputs['.--release_created'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs['.--tag_name'] }} cmyreflection.zip

      - name: Upload JSON Plugin Asset
        if: ${{ steps.release.outputs['plugins/json-plugin--release_created'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs['json-plugin--tag_name'] }} cmyreflection.zip

      - name: Upload Format Plugin Asset
        if: ${{ steps.release.outputs['plugins/format-plugin--release_created'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.release.outputs['format-plugin--tag_name'] }} cmyreflection.zip
